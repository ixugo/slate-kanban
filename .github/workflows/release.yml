# 发布 release 时，自动构建四个平台的程序包并补充到这个 release 里。
# 也可以在 Actions 页面手动运行，填入已有的 tag 补传（例如某次构建失败后重跑）。
name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要补充程序包的 release tag，例如 v1.2.3
        required: true
        type: string

# 只需要往 release 里上传文件的权限
permissions:
  contents: write

env:
  # release 触发时取 release 的 tag；手动运行时取填写的 tag
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 前端产物写进 internal/web/spa/dist，由 embed_web 标签嵌进程序；构建时会检查体积预算
      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      # 依赖都是纯 Go（SQLite 用 glebarez/sqlite），关闭 cgo 后一台机器就能交叉编译全部平台。
      # 包名固定为 slate_<tag>_<系统>_<架构>.tar.gz（windows 为 .zip），程序内的自动更新按这个规则挑包。
      - name: 构建四个平台的包
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.buildVersion=${TAG} -X main.gitBranch=release -X main.gitHash=${GITHUB_SHA::7} -X main.buildTime=$(date +%s) -X main.release=true"
          for target in windows/amd64 linux/arm64 linux/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="slate_${TAG}_${os}_${arch}"
            bin="slate"
            [ "$os" = "windows" ] && bin="slate.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -tags embed_web -trimpath -ldflags="$ldflags" -o "dist/${bin}" .
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "${bin}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${bin}"
            fi
            rm "dist/${bin}"
          done
          (cd dist && sha256sum slate_* > checksums.txt)
          ls -l dist

      # --clobber：重跑时覆盖同名文件
      - name: 上传到 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber
