# 发布 release 时，用 Makefile 构建四个平台的程序包并上传到该 release。
# 也可以在 Actions 页面手动运行，填入已有的 tag 补传（例如某次构建失败后重跑）。
# 打包逻辑在仓库里的 Makefile（release/assets）；本工作流只负责准备环境、检出源码和上传。
name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要补充程序包的 release tag，例如 v1.2.3
        required: true
        type: string

# 只需要往 release 里上传文件的权限
permissions:
  contents: write

env:
  # release 触发时取 release 的 tag；手动运行时取填写的 tag
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  assets:
    runs-on: ubuntu-latest
    # 整个任务最多 10 分钟，超时 GitHub 会自动取消，避免卡死后一直占用 runner
    timeout-minutes: 10
    steps:
      # tool：工作流所在提交，带最新的 Makefile；src：要打包的 tag 对应源码（旧 tag 可能没有新 Makefile）
      - name: 检出构建工具（Makefile）
        uses: actions/checkout@v5
        with:
          path: tool

      - name: 检出要打包的源码
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: src

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # upx 只压缩 linux 和 windows 的程序，体积能从约 30MB 降到约 9MB。
      # macOS 不压缩：upx 对 Apple 芯片的程序支持不可靠，压缩还会破坏代码签名。
      - name: 安装 upx
        env:
          UPX_VERSION: "5.3.0"
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/upx.tar.xz" "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          mkdir -p "${RUNNER_TEMP}/upx"
          tar -xJf "${RUNNER_TEMP}/upx.tar.xz" --strip-components=1 -C "${RUNNER_TEMP}/upx"
          echo "${RUNNER_TEMP}/upx" >> "$GITHUB_PATH"

      # 在 src 目录执行，借 tool 里的 Makefile；哈希和 ldflags 由 make 从 src 的 git 树读取
      - name: 用 Makefile 构建四个平台的包
        working-directory: src
        run: make -f ../tool/Makefile release/assets TAG="${TAG}"

      # --clobber：重跑时覆盖同名文件
      - name: 上传到 release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber