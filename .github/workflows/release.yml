# 发布 release 时，自动构建四个平台的程序包并补充到这个 release 里。
# 也可以在 Actions 页面手动运行，填入已有的 tag 补传（例如某次构建失败后重跑）。
name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要补充程序包的 release tag，例如 v1.2.3
        required: true
        type: string

# 只需要往 release 里上传文件的权限
permissions:
  contents: write

env:
  # release 触发时取 release 的 tag；手动运行时取填写的 tag
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 前端产物写进 internal/web/spa/dist，由 embed_web 标签嵌进程序；构建时会检查体积预算
      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      # upx 只压缩 linux 和 windows 的程序，体积能从约 30MB 降到约 9MB。
      # macOS 不压缩：upx 对 Apple 芯片的程序支持不可靠，压缩还会破坏代码签名。
      - name: 安装 upx
        env:
          UPX_VERSION: "5.3.0"
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/upx.tar.xz" "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          mkdir -p "${RUNNER_TEMP}/upx"
          tar -xJf "${RUNNER_TEMP}/upx.tar.xz" --strip-components=1 -C "${RUNNER_TEMP}/upx"
          echo "${RUNNER_TEMP}/upx" >> "$GITHUB_PATH"

      # 依赖都是纯 Go（SQLite 用 glebarez/sqlite），关闭 cgo 后一台机器就能交叉编译全部平台。
      # 包名固定为 slate_<tag>_<系统>_<架构>.tar.gz（windows 为 .zip），程序内的自动更新按这个规则挑包。
      # gitBranch 写成 release：main.go 靠它认出官方发布包，只有这样的程序才检查更新。
      - name: 构建四个平台的包
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.buildVersion=${TAG} -X main.gitBranch=release -X main.gitHash=${GITHUB_SHA::7} -X main.buildTime=$(date +%s) -X main.release=true"
          for target in windows/amd64 linux/arm64 linux/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="slate_${TAG}_${os}_${arch}"
            bin="slate"
            [ "$os" = "windows" ] && bin="slate.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -tags embed_web,nomsgpack -trimpath -ldflags="$ldflags" -o "dist/${bin}" .
            if [ "$os" != "darwin" ]; then
              upx --best --lzma -q "dist/${bin}"
              upx -t -q "dist/${bin}"
            fi
            # 压缩后的程序能不能跑，只有和 runner 同平台的 linux/amd64 能当场验证
            if [ "$os/$arch" = "linux/amd64" ]; then
              "dist/${bin}" service help > /dev/null
            fi
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "${bin}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${bin}"
            fi
            rm "dist/${bin}"
          done
          (cd dist && sha256sum slate_* > checksums.txt)
          ls -l dist

      # --clobber：重跑时覆盖同名文件
      - name: 上传到 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber
