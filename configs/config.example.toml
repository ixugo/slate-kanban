# Slate 配置样例。
# 首次启动时，如果 ~/.slate-kanban/config.toml 不存在，程序会按默认值生成它。
# 想手动准备配置：复制本文件为 ~/.slate-kanban/config.toml 再按需修改（-conf 指定了目录就放那里）。

# 配置格式版本。保留本值。
ConfigVersion = 1

[Server]
  [Server.HTTP]
    # 监听地址，默认 0.0.0.0（所有 IPv4 网卡），端口默认 7070
    Host = '0.0.0.0'
    # http 端口
    Port = 7070
    # 请求超时时间
    Timeout = '30s'
    # 可选访问口令；非空时网页登录与 MCP/REST 的 Bearer 头都要带对，留空则保持免登录
    Passcode = ''

    [Server.HTTP.PProf]
      # 是否启用 pprof, 建议设置为 true
      Enabled = true
      # pprof 访问 IP 白名单
      AccessIps = ['::1', '127.0.0.1']

[Data]
  # 图片等资源文件的存放目录，按项目分子目录，数据库里只存相对它的路径；留空则用配置目录下的 resource
  ResourceDir = '/home/you/.slate-kanban/resource'
  [Data.Database]
    # 留空使用 ~/.slate-kanban/data.db
    # postgres:// 或 postgresql:// 开头连接 PostgreSQL，例如 postgres://用户:密码@127.0.0.1:5432/库名?sslmode=disable
    # SQLite 可以直接填文件路径，也可以加 sqlite:// 前缀。相对路径以可执行文件所在目录为基准
    Dsn = ''
    MaxIdleConns = 1
    MaxOpenConns = 1
    ConnMaxLifetime = '6h0m0s'
    SlowThreshold = '200ms'

[Log]
  # 日志存储目录，不能使用特殊符号（首次生成的配置里是 ~/.slate-kanban/logs 的绝对路径；相对路径以启动目录为基准）
  Dir = '/home/you/.slate-kanban/logs'
  # 记录级别 debug/info/warn/error
  Level = 'info'
  # 保留日志多久，超过时间自动删除
  MaxAge = 7
  # 多久时间，分割一个新的日志文件
  RotationTime = '8h0m0s'
  # 多大文件，分割一个新的日志文件(MB)
  MaxSize = 50
  # 是否压缩日志
  Compress = false
  # 保留的旧日志归档文件最大数量，超出的自动删除
  MaxBackups = 0