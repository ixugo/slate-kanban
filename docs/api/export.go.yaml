openapi: "3.1.0"
info:
  title: 导出
  description: 看板导出。REST 接口固定以「人」的身份调用。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  "/api/v1/boards/{board_id}/export":
    get:
      tags:
        - admin/导出
      summary: 导出看板
      description: 把整块看板连同任务和评论导出成文件，响应头 Content-Disposition 带建议的文件名。format 默认 json，也可以选 md。
      operationId: exportBoard
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: 导出格式，默认 json
          schema:
            type: string
            enum:
              - json
              - md
      responses:
        "200":
          description: 导出文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardExport"
            text/markdown:
              schema:
                type: string
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Board:
      type: object
      properties:
        id:
          type: integer
          description: 看板编号
        name:
          type: string
          description: 看板名称
        slug:
          type: string
          description: 看板短标识，任务编号的前缀，创建后不可修改
        description:
          type: string
          description: 看板说明
        project_path:
          type: string
          description: 看板关联的本地项目路径
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: 标签库
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/Engineer"
          description: 工程师名册，每位是一个并发名额
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    BoardExport:
      type: object
      properties:
        format:
          type: string
          description: 固定为 slate-board-export
        version:
          type: integer
          description: 导出格式的版本，目前为 1
        exported_at:
          type: string
          format: date-time
          description: 导出时间
        seq:
          type: integer
          description: 导出时看板的最新事件序号
        board:
          $ref: "#/components/schemas/Board"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ExportCard"
          description: 全部任务，连同各自的评论
      description: JSON 格式的导出文件内容
    Column:
      type: object
      properties:
        id:
          type: integer
          description: 列编号
        board_id:
          type: integer
          description: 所属看板编号
        name:
          type: string
          description: 列名称
        instruction:
          type: string
          description: 给 agent 的指令，说明这一列的任务该怎么处理
        is_done:
          type: boolean
          description: 任务进入这一列是否算完成
        next_column_id:
          type: integer
          description: 任务完成交接后默认移入的下一列，0 表示没有
        sort:
          type: integer
          description: 排序值，越小越靠左
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    Comment:
      type: object
      properties:
        id:
          type: integer
          description: 评论编号
        board_id:
          type: integer
          description: 所属看板编号
        card_id:
          type: integer
          description: 所属任务编号
        author_kind:
          type: string
          description: 作者类型
          enum:
            - human
            - agent
            - system
        author:
          type: string
          description: 作者名称
        body:
          type: string
          description: 评论正文，Markdown 文本
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    Engineer:
      type: object
      properties:
        id:
          type: integer
          description: 工程师编号
        name:
          type: string
          description: 工程师名称，同一看板内不重名，最长 30 个字符
        kind:
          type: string
          enum:
            - dev
            - frontend
            - backend
            - ui
            - review
          description: 类型：dev 全栈，frontend 前端，backend 后端，ui UI（这四种都做研发，只是专长不同），review 测试
        prompt:
          type: string
          description: 角色提示词，调度 agent 派子 agent 时使用，最长 2000 个字符
        avatar:
          type: string
          description: 头像的随机种子，网页按它画头像；空表示用工程师编号
      description: 看板工程师名册里的一位工程师，每位是一个并发名额
    Error:
      type: object
      properties:
        trace_id:
          type: string
          description: 请求追踪编号，排查问题时提供给维护者
        reason:
          type: string
          description: 错误码，例如 ErrInvalidInput、ErrCardNotFound
        msg:
          type: string
          description: 错误说明，可以直接展示给用户
        details:
          type: array
          items:
            type: string
            description: 补充信息
          description: 附加信息，生产模式下不返回
      description: 所有失败响应的统一结构
      required:
        - reason
        - msg
    ExportCard:
      type: object
      properties:
        id:
          type: integer
          description: 任务编号
        board_id:
          type: integer
          description: 所属看板编号
        column_id:
          type: integer
          description: 所在列编号
        number:
          type: integer
          description: 看板内的任务序号
        key:
          type: string
          description: 任务编号，由看板 slug 和序号组成，例如 SLATE-12
        title:
          type: string
          description: 标题
        description:
          type: string
          description: 描述，Markdown 文本
        position:
          type: number
          description: 列内排序位置，越小越靠上
        priority:
          type: integer
          description: 优先级，0 未设置，1 低，2 中，3 高
        tag_ids:
          type: array
          items:
            type: integer
            description: 标签编号
          description: 标签编号列表，指向看板标签库
        human_only:
          type: boolean
          description: 是否只能由人处理
        waits_on:
          type: array
          items:
            type: integer
            description: 任务编号
          description: 依赖的任务编号列表
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: 到期时间
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: 开始时间
        finished_at:
          type:
            - string
            - "null"
          format: date-time
          description: 完成时间
        claimed_by:
          type: string
          description: 当前持有这个任务的 agent 名称，没有则为空
        claim_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 领取的到期时间
        engineer_id:
          type: integer
          description: 绑定或分配的全栈工程师编号，0 表示还没有
        claim_engineer_id:
          type: integer
          description: 当前领取这个任务的工程师编号，领取放开后为 0
        branch:
          type: string
          description: 关联的代码分支
        url:
          type: string
          description: 关联的链接，例如合并请求
        version:
          type: integer
          description: 版本号，每次真实修改加一，修改任务时可带上做冲突检测
        created_by:
          type: string
          description: 创建者名称
        updated_by:
          type: string
          description: 最后修改者名称
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        tags:
          type: array
          items:
            type: string
            description: 标签文字
          description: 任务上带文字的标签的文字，按任务上的顺序
        column:
          type: string
          description: 任务所在列的名称
        done:
          type: boolean
          description: 任务位于完成列
        waiting:
          type: boolean
          description: 任务有还没完成的依赖
        claim_active:
          type: boolean
          description: 任务正被某个 agent 领取，并且领取还没到期
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
          description: 全部评论
      description: 导出里的一个任务
    Rule:
      type: object
      properties:
        id:
          type: integer
          description: 规则编号
        board_id:
          type: integer
          description: 所属看板编号
        name:
          type: string
          description: 规则名称
        enabled:
          type: boolean
          description: 是否启用
        trigger:
          type: string
          description: 触发类型
          enum:
            - card_created
            - card_entered
            - card_left
        column_id:
          type: integer
          description: 触发所在的列，0 表示任意列
        condition:
          type: string
          description: 条件，使用任务筛选语法，空表示无条件
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RuleAction"
          description: 动作列表，按顺序执行
        sort:
          type: integer
          description: 排序值，越小越先执行
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    RuleAction:
      type: object
      properties:
        type:
          type: string
          description: 动作类型
          enum:
            - set_started_at
            - set_finished_at
            - clear_started_at
            - clear_finished_at
            - set_due
            - clear_due
            - set_priority
            - add_tag
            - remove_tag
            - set_human_only
            - add_comment
            - move_to_column
        mode:
          type: string
          description: set_started_at、set_finished_at 的写入模式：if_empty（默认）只在时间为空时写入，always 总是覆盖
          enum:
            - if_empty
            - always
        tag:
          type: string
          description: add_tag、remove_tag 使用的标签文字
        text:
          type: string
          description: add_comment 使用的评论内容
        column_id:
          type: integer
          description: move_to_column 使用的目标列编号
        days:
          type: integer
          description: set_due 使用的天数
        priority:
          type: integer
          description: set_priority 使用的优先级，1 低、2 中、3 高
        flag:
          type: boolean
          description: set_human_only 使用的开关值
      description: 自动化规则的一个动作，只有当前动作类型用到的字段才有意义
      required:
        - type
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: 标签编号
        text:
          type: string
          description: 标签文字，可以为空
        color:
          type: string
          description: 标签颜色，形如 green-2，空表示默认灰色
      description: 看板标签库里的一个标签
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 访问口令。只有服务设置了访问口令时才需要；网页登录后也可以只靠会话 cookie。
    cookieAuth:
      type: apiKey
      in: cookie
      name: slate_session
      description: 网页登录后种下的会话 cookie。
