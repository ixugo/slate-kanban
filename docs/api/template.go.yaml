openapi: "3.1.0"
info:
  title: 项目模板
  description: 自定义项目模板的导入、导出和列表。REST 接口固定以「人」的身份调用（列表人和 agent 都可读）。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/templates:
    get:
      tags:
        - admin/项目模板
      summary: 项目模板列表
      description: 返回全部自定义项目模板，不分页。不含内置起步模板 dev、simple、empty。
      operationId: listProjectTemplates
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectTemplateSummary"
        "401":
          description: 需要访问口令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - admin/项目模板
      summary: 导入项目模板
      description: 上传 slate-project-template JSON。replace=true 时覆盖同名模板（事务内先删后建）。
      operationId: importProjectTemplate
      parameters:
        - name: replace
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectTemplateFile"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTemplateDetail"
        "400":
          description: 请求不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 同名且未要求覆盖
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/templates/{template_id}":
    delete:
      tags:
        - admin/项目模板
      summary: 删除项目模板
      operationId: deleteProjectTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
        "404":
          description: 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/boards/{board_id}/template-export":
    get:
      tags:
        - admin/项目模板
      summary: 从看板导出为项目模板
      description: 下载 JSON，默认模板名为看板名称；只含标签、工程师和列，不含任务与规则。
      operationId: exportBoardProjectTemplate
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 模板 JSON 文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTemplateFile"
        "404":
          description: 看板不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ProjectTemplateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        updated_at:
          type: string
          format: date-time
    ProjectTemplateDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateTag"
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateEngineer"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateColumn"
    ProjectTemplateFile:
      type: object
      required:
        - format
        - version
        - name
      properties:
        format:
          type: string
          enum:
            - slate-project-template
        version:
          type: integer
        name:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateTag"
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateEngineer"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTemplateColumn"
    ProjectTemplateTag:
      type: object
      properties:
        text:
          type: string
        color:
          type: string
    ProjectTemplateEngineer:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
            - dev
            - frontend
            - backend
            - ui
            - review
        prompt:
          type: string
        avatar:
          type: string
    ProjectTemplateColumn:
      type: object
      properties:
        name:
          type: string
        instruction:
          type: string
        is_done:
          type: boolean
        next_column:
          type: integer
          description: 下一列在 columns 数组中的下标，-1 表示没有
    Error:
      type: object
      properties:
        reason:
          type: string
        msg:
          type: string