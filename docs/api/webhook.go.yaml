openapi: "3.1.0"
info:
  title: 活动通知 Webhook
  description: 看板活动事件的群机器人通知。仅供人类管理员使用，不暴露到 MCP。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  "/api/v1/boards/{board_id}/webhooks":
    get:
      tags:
        - admin/webhook
      summary: 列出 webhook
      operationId: listWebhooks
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookView"
    post:
      tags:
        - admin/webhook
      summary: 新增 webhook
      description: |
        新增活动通知。旧调用方省略筛选模式时，筛选项为空继续表示不限。
        2026-11-22
        - 增加可选 strict_filter_modes 字段。网页新建时为各维启用显式订阅。
      operationId: createWebhook
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookInput"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookView"
  "/api/v1/webhooks/{webhook_id}":
    patch:
      tags:
        - admin/webhook
      summary: 修改 webhook
      description: |
        仅更新传入字段。不修改订阅时，存量配置继续使用原有筛选语义。
        2026-11-22
        - 增加可选 strict_filter_modes 字段，其中未传的维度继续使用已有模式。旧 strict_filters 显式传值会替换全局模式，并清除先前的各维覆盖。
      operationId: updateWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookInput"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookView"
    delete:
      tags:
        - admin/webhook
      summary: 删除 webhook
      operationId: deleteWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
  "/api/v1/webhooks/{webhook_id}/test":
    post:
      tags:
        - admin/webhook
      summary: 测试发送
      operationId: testWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResult"
components:
  schemas:
    WebhookView:
      type: object
      properties:
        id:
          type: integer
        board_id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [dingtalk, wecom, feishu]
        url:
          type: string
        secret_set:
          type: boolean
        secret_mask:
          type: string
        enabled:
          type: boolean
        strict_filters:
          type: boolean
          description: 兼容开关，为没有单独设置的维度提供默认模式。
        strict_filter_modes:
          $ref: "#/components/schemas/WebhookFilterModes"
        event_types:
          type: array
          items:
            type: string
        actor_kinds:
          type: array
          items:
            type: string
            enum: [human, agent, system]
        move_column_ids:
          type: array
          items:
            type: integer
    CreateWebhookInput:
      type: object
      required: [name, type, url]
      properties:
        name:
          type: string
        type:
          type: string
        url:
          type: string
        secret:
          type: string
        enabled:
          type: boolean
        strict_filters:
          type: boolean
          default: false
          description: 默认 false，为没有单独设置的维度提供默认模式。
        strict_filter_modes:
          $ref: "#/components/schemas/WebhookFilterModes"
        event_types:
          type: array
          items:
            type: string
        actor_kinds:
          type: array
          items:
            type: string
        move_column_ids:
          type: array
          items:
            type: integer
    UpdateWebhookInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        url:
          type: string
        secret:
          type: string
        secret_clear:
          type: boolean
        enabled:
          type: boolean
        strict_filters:
          type: boolean
          description: 兼容开关。若传值，重置已有各维覆盖，之后再应用本次请求中明确传入的各维覆盖。
        strict_filter_modes:
          $ref: "#/components/schemas/WebhookFilterModes"
        event_types:
          type: array
          items:
            type: string
        actor_kinds:
          type: array
          items:
            type: string
        move_column_ids:
          type: array
          items:
            type: integer
    WebhookFilterModes:
      type: object
      description: 各维的覆盖开关。true 为显式选择，false 为该维空列表不限。未设置的维度继承 strict_filters；PATCH 中省略的维度保留原值。
      properties:
        event_types:
          type: boolean
          description: 显式模式下空选不发送任何事件。
        actor_kinds:
          type: boolean
          description: 显式模式下空选不发送任何操作者的事件。
        move_column_ids:
          type: boolean
          description: 显式模式下空选仅停止移动事件，其他事件不受此维度影响。
    TestWebhookResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: slate_session