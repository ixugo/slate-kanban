openapi: "3.1.0"
info:
  title: 登录
  description: 访问口令登录，三个接口都不要求已登录。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/auth/status:
    get:
      tags:
        - admin/登录
      summary: 登录状态
      description: 查询服务是否设置了访问口令，以及当前请求（会话 cookie 或 Bearer 头）是否已认证。带错误的 Bearer 头反复试探同样会被计数和封锁。
      operationId: getAuthStatus
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "429":
          description: 尝试次数过多，响应头 Retry-After 给出还要等待的秒数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - {}
  /api/v1/auth/login:
    post:
      tags:
        - admin/登录
      summary: 登录
      description: 校验访问口令，成功后种下会话 cookie。口令错误返回 401，连续失败会被临时封锁并返回 429。没设口令时直接返回成功。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passcode:
                  type: string
                  description: 访问口令，必填
              required:
                - passcode
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 尝试次数过多，响应头 Retry-After 给出还要等待的秒数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - {}
  /api/v1/auth/logout:
    post:
      tags:
        - admin/登录
      summary: 退出登录
      description: 清除会话 cookie。
      operationId: logout
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      security:
        - {}
components:
  schemas:
    AuthStatus:
      type: object
      properties:
        required:
          type: boolean
          description: 服务是否设置了访问口令
        authenticated:
          type: boolean
          description: 当前请求是否已经通过认证；没设口令时恒为 true
    Empty:
      type: object
      description: 没有内容的成功响应
      properties: {}
    Error:
      type: object
      properties:
        trace_id:
          type: string
          description: 请求追踪编号，排查问题时提供给维护者
        reason:
          type: string
          description: 错误码，例如 ErrInvalidInput、ErrCardNotFound
        msg:
          type: string
          description: 错误说明，可以直接展示给用户
        details:
          type: array
          items:
            type: string
            description: 补充信息
          description: 附加信息，生产模式下不返回
      description: 所有失败响应的统一结构
      required:
        - reason
        - msg
    LoginResult:
      type: object
      properties:
        authenticated:
          type: boolean
          description: 是否已经通过认证
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 访问口令。只有服务设置了访问口令时才需要；网页登录后也可以只靠会话 cookie。
    cookieAuth:
      type: apiKey
      in: cookie
      name: slate_session
      description: 网页登录后种下的会话 cookie。
