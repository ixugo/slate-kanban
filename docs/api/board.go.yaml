openapi: "3.1.0"
info:
  title: 看板
  description: 看板自身的增删改查。REST 接口固定以「人」的身份调用。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/boards:
    get:
      tags:
        - admin/看板
      summary: 看板列表
      description: 返回全部看板。
      operationId: listBoards
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - admin/看板
      summary: 创建看板
      description: 创建看板并按模板生成起步的列。slug 不填就按名称生成。
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 看板名称，必填
                slug:
                  type: string
                  description: 看板短标识，任务编号的前缀，可选；已被使用返回 409
                description:
                  type: string
                  description: 项目 AGENTS.md，Markdown 文本
                project_path:
                  type: string
                  description: 关联的本地项目路径
                template:
                  type: string
                  description: 起步模板，不填按 dev
                  enum:
                    - dev
                    - simple
                    - empty
                locale:
                  type: string
                  description: 起步列文案的语言，不认识的按 en
                project_template_id:
                  type: integer
                  description: 项目模板列表返回的编号。非 0 时使用该模板并忽略 template。内置研发模板使用 locale 生成本地化列和规则，自定义模板复制其列、标签和工程师。
              required:
                - name
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/boards/{board_id}":
    get:
      tags:
        - admin/看板
      summary: 看板详情
      description: 返回看板连同它的列和规则。
      operationId: getBoard
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - admin/看板
      summary: 修改看板
      description: 只更新请求里出现的字段。tags 整体替换标签库：库里原有、请求里没有的算删除（同时从所有任务上摘掉），编号相同的算修改文字或颜色，请求里的顺序就是显示顺序。engineers 整体替换工程师名册，规则相同：没有的算解聘（同时清掉任务上的绑定和占用）。
      operationId: updateBoard
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 看板名称
                description:
                  type: string
                  description: 项目 AGENTS.md，Markdown 文本
                project_path:
                  type: string
                  description: 关联的本地项目路径
                tags:
                  type: array
                  items:
                    $ref: "#/components/schemas/TagInput"
                  description: 整体替换标签库
                engineers:
                  type: array
                  items:
                    $ref: "#/components/schemas/EngineerInput"
                  description: 整体替换工程师名册，最多 20 位
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - admin/看板
      summary: 删除看板
      description: 删除看板和它的全部数据。看板已经不存在也返回成功。
      operationId: deleteBoard
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Board:
      type: object
      properties:
        id:
          type: integer
          description: 看板编号
        name:
          type: string
          description: 看板名称
        slug:
          type: string
          description: 看板短标识，任务编号的前缀，创建后不可修改
        description:
          type: string
          description: 项目 AGENTS.md，Markdown 文本
        project_path:
          type: string
          description: 看板关联的本地项目路径
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: 标签库
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/Engineer"
          description: 工程师名册，每位是一个并发名额
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        last_activity_at:
          type: string
          format: date-time
          description: 最后活动时间，取看板自身更新时间和最新事件时间里较晚的一个；列表接口按事件计算，其余接口等于更新时间
    BoardDetail:
      type: object
      properties:
        id:
          type: integer
          description: 看板编号
        name:
          type: string
          description: 看板名称
        slug:
          type: string
          description: 看板短标识，任务编号的前缀，创建后不可修改
        description:
          type: string
          description: 项目 AGENTS.md，Markdown 文本
        project_path:
          type: string
          description: 看板关联的本地项目路径
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: 标签库
        engineers:
          type: array
          items:
            $ref: "#/components/schemas/Engineer"
          description: 工程师名册，每位是一个并发名额
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        last_activity_at:
          type: string
          format: date-time
          description: 最后活动时间，取看板自身更新时间和最新事件时间里较晚的一个；列表接口按事件计算，其余接口等于更新时间
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
          description: 看板的列，从左到右
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
          description: 看板的自动化规则，按执行顺序
      description: 看板连同它的列和规则
    Column:
      type: object
      properties:
        id:
          type: integer
          description: 列编号
        board_id:
          type: integer
          description: 所属看板编号
        name:
          type: string
          description: 列名称
        instruction:
          type: string
          description: 给 agent 的指令，说明这一列的任务该怎么处理
        is_done:
          type: boolean
          description: 任务进入这一列是否算完成
        next_column_id:
          type: integer
          description: 任务完成交接后默认移入的下一列，0 表示没有
        sort:
          type: integer
          description: 排序值，越小越靠左
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    Empty:
      type: object
      description: 没有内容的成功响应
      properties: {}
    Engineer:
      type: object
      properties:
        id:
          type: integer
          description: 工程师编号
        name:
          type: string
          description: 工程师名称，同一看板内不重名，最长 30 个字符
        kind:
          type: string
          enum:
            - dev
            - frontend
            - backend
            - ui
            - review
          description: 类型：dev 全栈，frontend 前端，backend 后端，ui UI（这四种都做研发，只是专长不同），review 测试
        prompt:
          type: string
          description: 角色提示词，调度 agent 派子 agent 时使用，最长 2000 个字符
        avatar:
          type: string
          description: 头像的随机种子，网页按它画头像；空表示用工程师编号
      description: 看板工程师名册里的一位工程师，每位是一个并发名额
    EngineerInput:
      type: object
      properties:
        id:
          type: integer
          description: 工程师编号；填已有工程师的编号表示修改，0 表示招募
        name:
          type: string
          description: 工程师名称，必填，同一看板内不重名（不区分大小写），最长 30 个字符
        kind:
          type: string
          enum:
            - dev
            - frontend
            - backend
            - ui
            - review
          description: 类型：dev 全栈，frontend 前端，backend 后端，ui UI（这四种都做研发，只是专长不同），review 测试
        prompt:
          type: string
          description: 角色提示词，必填，最长 2000 个字符
        avatar:
          type: string
          description: 头像随机种子，只能是字母、数字、下划线、连字符，最长 32 个字符；招募时留空由服务端生成，修改时留空沿用原来的
      description: 整体替换工程师名册时的一位工程师
    Error:
      type: object
      properties:
        trace_id:
          type: string
          description: 请求追踪编号，排查问题时提供给维护者
        reason:
          type: string
          description: 错误码，例如 ErrInvalidInput、ErrCardNotFound
        msg:
          type: string
          description: 错误说明，可以直接展示给用户
        details:
          type: array
          items:
            type: string
            description: 补充信息
          description: 附加信息，生产模式下不返回
      description: 所有失败响应的统一结构
      required:
        - reason
        - msg
    Rule:
      type: object
      properties:
        id:
          type: integer
          description: 规则编号
        board_id:
          type: integer
          description: 所属看板编号
        name:
          type: string
          description: 规则名称
        enabled:
          type: boolean
          description: 是否启用
        trigger:
          type: string
          description: 触发类型
          enum:
            - card_created
            - card_entered
            - card_left
        column_id:
          type: integer
          description: 触发所在的列，0 表示任意列
        condition:
          type: string
          description: 条件，使用任务筛选语法，空表示无条件
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RuleAction"
          description: 动作列表，按顺序执行
        sort:
          type: integer
          description: 排序值，越小越先执行
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
    RuleAction:
      type: object
      properties:
        type:
          type: string
          description: 动作类型
          enum:
            - set_started_at
            - set_finished_at
            - clear_started_at
            - clear_finished_at
            - set_due
            - clear_due
            - set_priority
            - add_tag
            - remove_tag
            - set_human_only
            - add_comment
            - move_to_column
        mode:
          type: string
          description: set_started_at、set_finished_at 的写入模式：if_empty（默认）只在时间为空时写入，always 总是覆盖
          enum:
            - if_empty
            - always
        tag:
          type: string
          description: add_tag、remove_tag 使用的标签文字
        text:
          type: string
          description: add_comment 使用的评论内容
        column_id:
          type: integer
          description: move_to_column 使用的目标列编号
        days:
          type: integer
          description: 旧 set_due 动作使用的天数，仅兼容存量记录，已停用
        priority:
          type: integer
          description: set_priority 使用的优先级，1 低、2 中、3 高
        flag:
          type: boolean
          description: set_human_only 使用的开关值
      description: 自动化规则的一个动作，只有当前动作类型用到的字段才有意义
      required:
        - type
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: 标签编号
        text:
          type: string
          description: 标签文字，可以为空
        color:
          type: string
          description: 标签颜色，形如 green-2，空表示默认灰色
      description: 看板标签库里的一个标签
    TagInput:
      type: object
      properties:
        id:
          type: integer
          description: 标签编号；填已有标签的编号表示修改，0 表示新增
        text:
          type: string
          description: 标签文字，最长 30 个字符，可以为空
        color:
          type: string
          description: 标签颜色，形如 green-2，空表示默认灰色
      description: 整体替换标签库时的一个标签
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 访问口令。只有服务设置了访问口令时才需要；网页登录后也可以只靠会话 cookie。
    cookieAuth:
      type: apiKey
      in: cookie
      name: slate_session
      description: 网页登录后种下的会话 cookie。
