openapi: "3.1.0"
info:
  title: 任务
  description: "任务的读写、移动和评论。REST 接口固定以「人」的身份调用。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  "/api/v1/boards/{board_id}/cards":
    get:
      tags:
        - admin/任务
      summary: 任务列表
      description: 按筛选条件列出看板里尚未归档的任务，顺序和看板上看到的一致。query 的语法和网页搜索框一致，写错返回 400 并指出是哪个词有问题。
      operationId: listCards
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
        - name: query
          in: query
          required: false
          description: 筛选条件，不填返回全部
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: 最多返回几个，默认 200，最大 500，负数不合法
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - admin/任务
      summary: 创建任务
      description: 创建任务。column_id 不填放到第一列，任务放到所在列的末尾。
      operationId: createCard
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 标题，必填，最长 200 个字符
                description:
                  type: string
                  description: 描述，Markdown 文本
                priority:
                  type: integer
                  description: 优先级，0 未设置，1 低，2 中，3 高
                tags:
                  type: array
                  items:
                    type: string
                    description: 标签文字
                  description: 按文字指定标签；库里没有的文字会新建一个没有颜色的标签。和 tag_ids 只填一个
                tag_ids:
                  type: array
                  items:
                    type: integer
                    description: 标签编号
                  description: 按编号指定标签。和 tags 只填一个
                human_only:
                  type: boolean
                  description: 是否只能由人处理
                engineer_id:
                  type: integer
                  description: 绑定一位全栈工程师（编号来自看板的 engineers），0 表示不绑定，领取时随机分配
                waits_on:
                  type: array
                  items:
                    type: integer
                    description: 任务编号
                  description: 依赖的任务编号，最多 20 个
                due_at:
                  type: string
                  description: "到期时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                started_at:
                  type: string
                  description: "开始时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                finished_at:
                  type: string
                  description: "完成时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                branch:
                  type: string
                  description: 关联的代码分支
                url:
                  type: string
                  description: 关联的链接
                column_id:
                  type: integer
                  description: 放入的列编号
              required:
                - title
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}":
    get:
      tags:
        - admin/任务
      summary: 任务详情
      description: 返回任务的完整信息：派生状态、所在列给 agent 的工作指令、依赖和全部评论。
      operationId: getCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetail"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - admin/任务
      summary: 修改任务
      description: |
        只更新请求里出现的字段。带上 version 时和当前版本比较，不一致返回 409，避免覆盖别人的修改。
        修改描述时会同时留下一条变更记录（修改前和修改后的完整内容），记录编号写在 card.updated 事件内容的 description_change_id 里，可用「任务变更记录」接口读取。
        更新说明：
        2026-11-21
        - card.updated 事件的内容在修改了描述时多一个 description_change_id 字段
      operationId: updateCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 标题，必填，最长 200 个字符
                description:
                  type: string
                  description: 描述，Markdown 文本
                priority:
                  type: integer
                  description: 优先级，0 未设置，1 低，2 中，3 高
                tags:
                  type: array
                  items:
                    type: string
                    description: 标签文字
                  description: 按文字指定标签；库里没有的文字会新建一个没有颜色的标签。和 tag_ids 只填一个
                tag_ids:
                  type: array
                  items:
                    type: integer
                    description: 标签编号
                  description: 按编号指定标签。和 tags 只填一个
                human_only:
                  type: boolean
                  description: 是否只能由人处理
                engineer_id:
                  type: integer
                  description: 绑定一位全栈工程师（编号来自看板的 engineers），0 表示不绑定，领取时随机分配
                waits_on:
                  type: array
                  items:
                    type: integer
                    description: 任务编号
                  description: 依赖的任务编号，最多 20 个
                due_at:
                  type: string
                  description: "到期时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                started_at:
                  type: string
                  description: "开始时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                finished_at:
                  type: string
                  description: "完成时间。时间字段用 RFC3339 格式，例如 2026-11-17T09:30:00+08:00，空字符串表示不设置。"
                branch:
                  type: string
                  description: 关联的代码分支
                url:
                  type: string
                  description: 关联的链接
                version:
                  type: integer
                  description: 读到这个任务时的版本号，用来做冲突检测，可选
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 状态冲突，或任务已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - admin/任务
      summary: 删除任务
      description: 删除普通或归档任务，只有人能做。任务不存在也返回成功。
      operationId: deleteCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/changes/{change_id}":
    get:
      tags:
        - admin/任务
      summary: 任务变更记录
      description: |
        返回任务的一次变更记录：修改前和修改后的完整内容，网页的「查看变更」据此左右对比两个版本。
        目前只记录描述的修改；修改描述时，对应的 card.updated 事件内容里带 description_change_id，就是这里的 change_id。
        记录不存在、不属于这个任务，或者任务已经被删除，都返回 404。
        返回里带 prev_id、next_id：同一个任务里前一条和后一条记录的编号（没有为 0），网页据此翻页。
        更新说明：
        2026-11-22
        - 返回增加 prev_id、next_id、previous_at
        2026-11-21
        - 新增接口
      operationId: getCardChange
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
        - name: change_id
          in: path
          required: true
          description: 变更记录编号，取自 card.updated 事件内容里的 description_change_id
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardChange"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 变更记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/read":
    post:
      tags:
        - admin/任务
      summary: 标记任务已读
      description: 把任务的未读动态数清零。幂等，不写活动事件，不增加版本号。仅供网页在用户打开任务详情时调用。
      operationId: markCardRead
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/move":
    post:
      tags:
        - admin/任务
      summary: 移动任务
      description: 移动任务到某列，或者调整同一列里的顺序。before_id、after_id 指定放到哪个任务的前面或后面，最多填一个，都不填放到目标列末尾。
      operationId: moveCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column_id:
                  type: integer
                  description: 目标列编号，不填或 0 表示留在当前列，只调整顺序
                before_id:
                  type: integer
                  description: 放到这个任务的前面
                after_id:
                  type: integer
                  description: 放到这个任务的后面
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 状态冲突，或任务已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/comments":
    post:
      tags:
        - admin/任务
      summary: 写评论
      description: 在任务下写一条评论。
      operationId: addComment
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务编号
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 评论正文，Markdown 文本，必填
              required:
                - body
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 任务已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/comments/{comment_id}":
    delete:
      tags:
        - admin/任务
      summary: 删除评论
      description: 评论已经不存在也返回成功。
      operationId: deleteComment
      parameters:
        - name: comment_id
          in: path
          required: true
          description: 评论编号
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 任务已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/archive":
    post:
      tags:
        - admin/任务
      summary: 归档任务
      description: 保留任务正文、评论、归档时的标签和依赖并释放当前领取。重复归档返回当前归档状态。
      operationId: archiveCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务主键
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          description: 需要访问口令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/cards/{card_id}/fork":
    post:
      tags:
        - admin/任务
      summary: 延续任务（Fork）
      description: 在同一看板的收件箱创建新任务，继承标题、优先级、标签、依赖、链接和仅人工。描述引用原任务，评论为空。Fork 保留指定落点和继承字段，不触发创建自动化。
      operationId: forkCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 任务主键
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          description: 需要访问口令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 找不到收件箱，或原任务的标签或依赖已被删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/boards/{board_id}/archived-cards":
    get:
      tags:
        - admin/任务
      summary: 归档任务列表
      description: 按归档时间和任务主键倒序分页，每页最多 20 条。
      operationId: listArchivedCards
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
            minimum: 1
        - name: before
          in: query
          required: false
          description: 旧客户端分页参数，上一页最后一条的任务主键。不能与 cursor 同时提供
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 next_cursor，不填从最新归档开始。即使上一页末条已删除也可续页
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedCardsPage"
        "400":
          description: 游标参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 看板或归档游标不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/boards/{board_id}/cards/by-number/{number}":
    get:
      tags:
        - admin/任务
      summary: 按序号读取任务
      description: 读取指定看板内的任务详情，包括归档任务。
      operationId: getCardByNumber
      parameters:
        - name: board_id
          in: path
          required: true
          description: 看板编号
          schema:
            type: integer
            minimum: 1
        - name: number
          in: path
          required: true
          description: 看板内的任务序号
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetail"
        "400":
          description: 序号无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 看板或任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ArchivedCardsPage:
      type: object
      required: [cards, has_more]
      properties:
        cards:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Card"
        has_more:
          type: boolean
          description: 还有更早的归档任务
        next_cursor:
          type: string
          description: 用于请求下一页的游标。没有下一页时省略
    Card:
      type: object
      properties:
        id:
          type: integer
          description: 任务编号
        board_id:
          type: integer
          description: 所属看板编号
        column_id:
          type: integer
          description: 所在列编号
        number:
          type: integer
          description: 看板内的任务序号
        key:
          type: string
          description: 任务编号，由看板 slug 和序号组成，例如 SLATE-12
        title:
