openapi: "3.1.0"
info:
  title: 自动更新
  description: 检查 GitHub release 的新版本，并下载替换本地程序。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:7070"
    description: 本机默认地址
security:
  - {}
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/update:
    get:
      tags:
        - admin/自动更新
      summary: 检查更新
      description: 服务端读取 github.com 的发布版本、更新说明和当前平台的安装包状态。成功结果缓存 10 秒。请求失败时按“没有更新”返回，5 分钟内不重试。
      operationId: getUpdate
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateInfo"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - admin/自动更新
      summary: 立即更新
      description: 下载当前平台的包，用 checksums.txt 校验 sha256 后替换本地程序，不做备份；替换成功后服务会在响应发出后自动重启（以 Windows 服务运行时除外，响应里 restarting 为 false，需手动重启）。容器里、已经是最新版本、新版本的安装包还没上传完、校验不通过都会失败，失败时不改动现有程序。
      operationId: applyUpdate
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateApplied"
        "400":
          description: 请求参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 需要访问口令（只在设置了访问口令时出现）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务端出错
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        trace_id:
          type: string
          description: 请求追踪编号，排查问题时提供给维护者
        reason:
          type: string
          description: 错误码，例如 ErrInvalidInput、ErrCardNotFound
        msg:
          type: string
          description: 错误说明，可以直接展示给用户
        details:
          type: array
          items:
            type: string
            description: 补充信息
          description: 附加信息，生产模式下不返回
      description: 所有失败响应的统一结构
      required:
        - reason
        - msg
    UpdateApplied:
      type: object
      properties:
        version:
          type: string
          description: 已经替换成功的版本号，程序重启后才生效
        restarting:
          type: boolean
          description: 服务端是否已安排自动重启：为 true 时响应发出后服务会优雅关闭并用新程序重启（类 Unix 原地 exec，PID 不变），网页等新版本起来后刷新即可；为 false（例如以 Windows 服务运行）需要用户手动重启
      required:
        - version
        - restarting
      description: 自动更新的结果
    UpdateInfo:
      type: object
      properties:
        current:
          type: string
          description: 当前程序的版本号
        latest:
          type: string
          description: GitHub 上最新 release 的版本号，查询失败时为空
        notes:
          type: string
          description: 最新版本的更新说明（release 正文），最多 4000 个字符
        url:
          type: string
          description: 最新 release 的页面地址
        has_update:
          type: boolean
          description: 是否有更高的版本；所有构建（含本机编译）都会检查，新 release 里当前平台的包和 checksums.txt 都已上传后才为 true
        can_apply:
          type: boolean
          description: 能否立即更新：有新版本（包已上传完），并且不在容器里
        check_state:
          type: string
          enum:
            - ok
            - unreachable
          description: 检查状态。ok 表示成功读到 release；unreachable 表示查询 GitHub 失败
      description: 自动更新的检查结果
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 访问口令。只有服务设置了访问口令时才需要；网页登录后也可以只靠会话 cookie。
    cookieAuth:
      type: apiKey
      in: cookie
      name: slate_session
      description: 网页登录后种下的会话 cookie。
